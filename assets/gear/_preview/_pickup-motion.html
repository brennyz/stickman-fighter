<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gear pickup motion — spawn / flame / pose</title>
<style>
  html,body{margin:0;background:#0e1424;color:#e8f0ff;font-family:system-ui,sans-serif}
  body{padding:20px 24px}
  h1{color:#ffd75e;font-size:22px;margin:0 0 6px;letter-spacing:.02em}
  .sub{opacity:.75;font-size:13px;margin:0 0 16px}
  .row{display:flex;gap:18px}
  .col{flex:1;min-width:0}
  .col h2{font-size:13px;margin:0 0 8px;color:#9db1e3;font-weight:700}
  canvas{background:linear-gradient(180deg,#1c2744,#0e1424);image-rendering:pixelated;border-radius:12px;display:block;width:100%;height:auto}
</style>
</head>
<body>
<h1>Pickup motion strip</h1>
<p class="sub">spawn pop · 3-frame fakkel · ready tilt · glow pulse</p>
<div class="row">
  <div class="col"><h2>hell fakkel</h2><canvas id="c0" width="200" height="360"></canvas></div>
  <div class="col"><h2>void glow</h2><canvas id="c1" width="200" height="360"></canvas></div>
  <div class="col"><h2>rare pop</h2><canvas id="c2" width="200" height="360"></canvas></div>
</div>
<script src="../../../src/data/gear.js"></script>
<script src="../../../src/data/gear-world.js"></script>
<script>
(function () {
  function rarityOf(r) {
    const m = { common:{color:'#c8d0dc'}, uncommon:{color:'#8fd98a'}, rare:{color:'#7eb6ff'},
      epic:{color:'#c792ff'}, legendary:{color:'#ffd75e'}, mythic:{color:'#ff6b9d'},
      nightmare:{color:'#c47aff'}, hell:{color:'#ff6a3d'} };
    return m[r] || m.common;
  }
  window.rarityOf = rarityOf;
  const TAU = Math.PI * 2;
  const cols = [
    { id: 'back_wings_hell', tier: 'superBoss', canvas: 'c0', ages: [0.02, 0.1, 0.28], ts: [0.05, 0.18, 0.32] },
    { id: 'head_helm_void', tier: 'elite', canvas: 'c1', ages: [0.04, 0.12, 0.4], ts: [0.4, 0.8, 1.2] },
    { id: 'head_helm_iron', tier: 'normal', canvas: 'c2', ages: [0.01, 0.09, 0.24], ts: [0.2, 0.5, 0.9] },
  ];
  for (let col = 0; col < cols.length; col++) {
    const spec = cols[col];
    const canvas = document.getElementById(spec.canvas);
    const c = canvas.getContext('2d');
    c.imageSmoothingEnabled = false;
    const it = gearById(spec.id);
    const feel = gearPickupFeel(it, spec.tier);
    for (let f = 0; f < 3; f++) {
      const x = 100;
      const y = 58 + f * 110;
      const pk = { gearId: spec.id, dropTier: spec.tier, t: spec.ts[f], x: x, age: spec.ages[f] };
      const motion = gearPickupMotion(pk, feel);
      const colr = gearAccent(it);
      const showScale = Math.max(3.4, feel.scale) * motion.pop;
      const orbR = Math.max(18, feel.orbR + 6) * motion.pop;
      c.save();
      c.globalAlpha = 0.55;
      c.fillStyle = colr;
      c.beginPath(); c.arc(x, y, orbR, 0, TAU); c.fill();
      c.globalAlpha = 1;
      c.strokeStyle = '#fff'; c.lineWidth = 2;
      c.beginPath(); c.arc(x, y, orbR, 0, TAU); c.stroke();
      if (feel.ring) {
        c.strokeStyle = feel.ring; c.lineWidth = 2;
        c.beginPath(); c.arc(x, y, orbR + 4, 0, TAU); c.stroke();
      }
      drawGearPixels(c, spec.id, x, y, showScale, { tilt: motion.tilt, frame: motion.frame });
      gearPickupDrawFx(c, pk, y, Object.assign({}, feel, { orbR: orbR }));
      c.restore();
    }
  }
})();
</script>
</body>
</html>
