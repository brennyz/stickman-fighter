<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gear pickup motion — 3-frame strip</title>
<style>
  html,body{margin:0;background:#0e1424;color:#e8f0ff;font-family:system-ui,sans-serif}
  body{padding:16px}
  h1{color:#ffd75e;font-size:18px;margin:0 0 6px}
  .sub{opacity:.7;font-size:12px;margin:0 0 12px}
  canvas{background:linear-gradient(180deg,#1c2744,#0e1424);image-rendering:pixelated;border-radius:12px;display:block}
</style>
</head>
<body>
<h1>Pickup motion strip</h1>
<p class="sub">3 frames · hell flicker · void glow · elite sparkle · ring pulse</p>
<canvas id="c" width="520" height="220"></canvas>
<script src="../../../src/data/gear.js"></script>
<script src="../../../src/data/gear-world.js"></script>
<script>
(function () {
  function rarityOf(r) {
    const m = { common:{color:'#c8d0dc'}, uncommon:{color:'#8fd98a'}, rare:{color:'#7eb6ff'},
      epic:{color:'#c792ff'}, legendary:{color:'#ffd75e'}, mythic:{color:'#ff6b9d'},
      nightmare:{color:'#c47aff'}, hell:{color:'#ff6a3d'} };
    return m[r] || m.common;
  }
  window.rarityOf = rarityOf;
  const TAU = Math.PI * 2;
  const c = document.getElementById('c').getContext('2d');
  c.imageSmoothingEnabled = false;
  const cols = [
    { id: 'back_wings_hell', tier: 'superBoss', label: 'hell' },
    { id: 'head_helm_void', tier: 'elite', label: 'void' },
    { id: 'back_aura_glow', tier: 'normal', label: 'aura' },
  ];
  const times = [0.05, 0.18, 0.32];
  for (let col = 0; col < cols.length; col++) {
    const spec = cols[col];
    const it = gearById(spec.id);
    const feel = gearPickupFeel(it, spec.tier);
    for (let f = 0; f < 3; f++) {
      const x = 70 + col * 170;
      const y = 50 + f * 56;
      const pk = { gearId: spec.id, dropTier: spec.tier, t: times[f], x: x };
      const colr = gearAccent(it);
      c.save();
      c.fillStyle = colr;
      c.beginPath(); c.arc(x, y, feel.orbR, 0, TAU); c.fill();
      c.strokeStyle = '#fff'; c.lineWidth = 2;
      c.beginPath(); c.arc(x, y, feel.orbR, 0, TAU); c.stroke();
      if (feel.ring) {
        c.strokeStyle = feel.ring; c.lineWidth = 2;
        c.beginPath(); c.arc(x, y, feel.orbR + 3, 0, TAU); c.stroke();
      }
      drawGearPixels(c, spec.id, x, y, feel.scale);
      gearPickupDrawFx(c, pk, y, feel);
      c.restore();
      if (f === 0) {
        c.fillStyle = 'rgba(232,240,255,.75)';
        c.font = '700 10px system-ui';
        c.textAlign = 'center';
        c.fillText(spec.label, x, 18);
      }
    }
  }
})();
</script>
</body>
</html>
