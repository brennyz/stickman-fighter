<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Play feature graphic</title>
<style>
  html, body { margin: 0; width: 1024px; height: 500px; overflow: hidden; }
  body {
    background: linear-gradient(135deg, #0a0d18 0%, #151b33 55%, #1b2a4a 100%);
    color: #e8f0ff;
    font-family: "DejaVu Sans", "Liberation Sans", Arial, sans-serif;
    display: flex;
    align-items: center;
    padding: 0 56px;
    box-sizing: border-box;
  }
  img { width: 220px; height: 220px; border-radius: 48px; box-shadow: 0 12px 40px #0008; }
  .copy { margin-left: 48px; }
  h1 { margin: 0 0 8px; font-size: 56px; letter-spacing: -0.02em; }
  p { margin: 0; font-size: 26px; color: #9db1e3; }
  .badge {
    display: inline-block; margin-top: 18px; padding: 6px 14px;
    border-radius: 999px; background: #ffd75e; color: #1a1400;
    font-weight: 700; font-size: 16px;
  }
</style>
</head>
<body>
  <img src="../../icons/icon-512.png" alt="">
  <div class="copy">
    <h1>Stickman Fighter</h1>
    <p>Avontuur · training · arcade</p>
    <span class="badge">Gratis · geen IAP</span>
  </div>
</body>
</html>
